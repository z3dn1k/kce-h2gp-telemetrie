[package]
name = "h2gp-telemetry"
version = "1.0.2"
edition = "2021"
authors = ["Jan Zedník <zednikjan91@gmail.com>"]
description = "Real-time telemetry dashboard for H2GP hydrogen fuel cell vehicles"
license = "MIT"
readme = "README.md"
repository = "https://github.com/z3dn1k/kce-h2gp-telemetrie"
keywords = ["telemetry", "h2gp", "fuel-cell", "egui", "serial"]
categories = ["embedded", "gui", "science"]

[lints.rust]
unsafe_code = "forbid"

[dependencies]
eframe = "0.31"
egui_plot = "0.31"

serialport = "4.5"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

image = { version = "0.25", default-features = false, features = ["png"] }
thiserror = "2.0"
